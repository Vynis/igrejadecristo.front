<nb-card>
  <nb-card-header>
    <h5>Filtro</h5>
  </nb-card-header>
  <nb-card-body>
    <div class="row">
      <div class="col-sm-10">
        <label for="nome" class="label">Nome</label>
        <input type="text" [(ngModel)]="nome" nbInput fullWidth placeholder="nome">
      </div>
      <div class="col-sm-2" style="padding-top: 24px;">
        <button type="button" (click)="obterDadosGrid()" nbButton status="primary" fullWidth>Filtrar</button>
      </div>
    </div>
  </nb-card-body>
</nb-card>

<nb-card>
  <nb-card-header>
    <div class="row">
      <div class="col-sm-10" style="padding-top: 15px;">
        <h5>Evolução dos Alunos</h5>
      </div>
      <div *ngIf="temPermissao('relatorios.evolucao_alunos')" class="col-sm-2" style="text-align: right">
        <a nbButton status="success" (click)="downloadExcel()">Exportar para Excel</a>
      </div>
    </div>
  </nb-card-header>
  <nb-card-body>
    <div *ngIf="listaCabecalhoTabela.length == 0">
      Nenhum registro encontrado.
    </div>

    <div class="row" *ngIf="listaCabecalhoTabela.length > 0">
      <div class="col-md-12 table-responsive">
        <table class="table table-striped">
          <thead>
            <tr style="font-weight: bold;">
              <td *ngFor="let col of listaCabecalhoTabela">{{col}}</td>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let row of listaEvolucaoUsuarios">
              <td *ngFor="let col of listaCabecalhoTabela">{{ formataValorTexto(row, col) }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </nb-card-body>
</nb-card>
