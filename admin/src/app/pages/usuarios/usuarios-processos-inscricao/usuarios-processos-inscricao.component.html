<nb-card>
  <nb-card-header>
    <div class="row">
      <div class="col-sm-10" style="padding-top: 15px;">
        <h5>Processos de inscrição do usuário {{idUsuario}}</h5>
      </div>
      <div class="col-sm-2" style="text-align: right">
        <a nbButton status="danger" routerLink="/pages/usuarios/lista">Voltar</a>
      </div>
    </div>
  </nb-card-header>
  <nb-card-body>
    <app-grid-view [colunas]="colunas" [acoes]="acoes" [dadosTabela]="dadosTabela"></app-grid-view>
  </nb-card-body>
</nb-card>
