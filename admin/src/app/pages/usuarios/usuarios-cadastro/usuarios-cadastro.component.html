<div class="row">
  <div class="col-md-12">
    <form *ngIf="usuario" [formGroup]="formulario">
      <nb-card>
        <nb-card-header>
          <h5>{{tituloPagina}}</h5>
        </nb-card-header>
        <nb-card-body>
          <div class="row">
            <div class="col-sm-4">
              <label for="nome" class="label">Nome</label>
              <input type="text" class="form-control" nbInput fullWidth id="nome" formControlName="nome">
            </div>
            <div class="col-sm-4">
              <label for="email" class="label">Email</label>
              <input type="text" class="form-control" nbInput fullWidth id="email" formControlName="email">
            </div>
            <div class="col-sm-2">
              <label for="cpf" class="label">CPF</label>
              <input type="text" class="form-control" nbInput fullWidth id="cpf" formControlName="cpf">
            </div>
            <div class="col-sm-2">
              <label for="telefoneCelular" class="label">Celular</label>
              <input type="text" class="form-control" nbInput fullWidth id="telefoneCelular" formControlName="telefoneCelular">
            </div>
          </div>

          <div class="row" style="margin-top: 15px;">
            <div class="col-sm-2">
              <label for="status" class="label">Status</label>
              <nb-select fullWidth id="status" formControlName="status">
                <nb-option value="A">Ativo</nb-option>
                <nb-option value="I">Inativo</nb-option>
              </nb-select>
            </div>
            <div class="col-sm-2">
              <label for="tipoAcesso" class="label">Tipo Acesso</label>
              <input type="text" class="form-control" nbInput fullWidth id="tipoAcesso" formControlName="tipoAcesso">
            </div>
            <div class="col-sm-2">
              <label for="dataNascimento" class="label">Nascimento</label>
              <input type="date" class="form-control" id="dataNascimento" formControlName="dataNascimento">
            </div>
            <div class="col-sm-2">
              <label for="congregacaoId" class="label">Congregação Id</label>
              <input type="number" class="form-control" nbInput fullWidth id="congregacaoId" formControlName="congregacaoId">
            </div>
            <div class="col-sm-2">
              <label for="estado" class="label">Estado</label>
              <input type="text" class="form-control" nbInput fullWidth id="estado" formControlName="estado">
            </div>
            <div class="col-sm-2">
              <label for="cidade" class="label">Cidade</label>
              <input type="text" class="form-control" nbInput fullWidth id="cidade" formControlName="cidade">
            </div>
          </div>

          <div class="row" style="margin-top: 15px;">
            <div class="col-sm-3">
              <label for="bairro" class="label">Bairro</label>
              <input type="text" class="form-control" nbInput fullWidth id="bairro" formControlName="bairro">
            </div>
            <div class="col-sm-3">
              <label for="rua" class="label">Rua</label>
              <input type="text" class="form-control" nbInput fullWidth id="rua" formControlName="rua">
            </div>
            <div class="col-sm-2">
              <label for="numero" class="label">Número</label>
              <input type="text" class="form-control" nbInput fullWidth id="numero" formControlName="numero">
            </div>
            <div class="col-sm-2">
              <label for="complemento" class="label">Complemento</label>
              <input type="text" class="form-control" nbInput fullWidth id="complemento" formControlName="complemento">
            </div>
            <div class="col-sm-2">
              <label for="cep" class="label">CEP</label>
              <input type="text" class="form-control" nbInput fullWidth id="cep" formControlName="cep">
            </div>
          </div>
        </nb-card-body>
        <nb-card-footer>
          <div class="row">
            <div class="col-sm-1">
              <button (click)="salvar()" type="submit" nbButton status="success">Enviar</button>
            </div>
            <div class="col-sm-2">
              <a ghost nbButton status="danger" routerLink="/pages/usuarios/lista">Voltar</a>
            </div>
          </div>
        </nb-card-footer>
      </nb-card>
    </form>
  </div>
</div>
