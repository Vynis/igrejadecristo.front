<nb-card class="aluno-busca-dialog">
  <nb-card-header>
    Pesquisar aluno
  </nb-card-header>
  <nb-card-body>
    <form [formGroup]="formulario">
      <div class="row">
        <div class="col-sm-10">
          <label for="nomeAluno" class="label">Nome do aluno</label>
          <input nbInput fullWidth id="nomeAluno" formControlName="nome" placeholder="Digite pelo menos 3 caracteres" (keyup.enter)="pesquisar()">
        </div>
        <div class="col-sm-2 aluno-busca-dialog__acao">
          <button nbButton status="primary" fullWidth type="button" (click)="pesquisar()">Pesquisar</button>
        </div>
      </div>
    </form>

    <table class="table table-striped aluno-busca-dialog__tabela" *ngIf="usuarios.length > 0">
      <thead>
        <tr>
          <th>Id</th>
          <th>Nome</th>
          <th>CPF</th>
          <th>Email</th>
          <th>Celular</th>
          <th>Status</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let usuario of usuarios">
          <td>{{ usuario.id }}</td>
          <td>{{ usuario.nome }}</td>
          <td>{{ usuario.cpf || '-' }}</td>
          <td>{{ usuario.email || '-' }}</td>
          <td>{{ usuario.telefoneCelular || '-' }}</td>
          <td>{{ usuario.status === 'A' ? 'Ativo' : 'Inativo' }}</td>
          <td class="text-right">
            <button nbButton size="tiny" status="success" type="button" (click)="selecionar(usuario)">Selecionar</button>
          </td>
        </tr>
      </tbody>
    </table>

    <nb-alert status="info" *ngIf="pesquisou && usuarios.length === 0" class="aluno-busca-dialog__sem-resultado">
      Nenhum aluno encontrado para o nome informado.
    </nb-alert>
  </nb-card-body>
  <nb-card-footer>
    <button nbButton status="basic" type="button" (click)="fechar()">Fechar</button>
  </nb-card-footer>
</nb-card>
