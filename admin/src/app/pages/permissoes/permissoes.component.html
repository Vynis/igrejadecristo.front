<nb-card>
  <nb-card-header>
    <h5>Permissões por Perfil</h5>
  </nb-card-header>
  <nb-card-body>
    <div class="row">
      <div class="col-sm-6">
        <label>Perfil</label>
        <nb-select fullWidth placeholder="Selecione um perfil" [(selected)]="perfilId" (selectedChange)="selecionarPerfil($event)">
          <nb-option *ngFor="let perfil of perfis" [value]="perfil.id">{{ perfil.titulo }}</nb-option>
        </nb-select>
      </div>
    </div>
  </nb-card-body>
</nb-card>

<nb-card *ngIf="perfilId">
  <nb-card-header>
    <div class="row">
      <div class="col-sm-10" style="padding-top: 10px;">
        <h5>Permissões disponíveis</h5>
      </div>
      <div class="col-sm-2" style="text-align: right;">
        <button nbButton status="primary" (click)="salvar()" [disabled]="salvando || carregando">Salvar</button>
      </div>
    </div>
  </nb-card-header>
  <nb-card-body>
    <nb-alert *ngIf="carregando" status="info">Carregando permissões...</nb-alert>

    <div class="permissoes-grid" *ngIf="!carregando">
      <label class="permissao-item" *ngFor="let permissao of permissoes">
        <nb-checkbox
          [checked]="permissaoMarcada(permissao.id)"
          (checkedChange)="alterarPermissao(permissao.id, $event)">
          {{ permissao.titulo }}
        </nb-checkbox>
        <small>{{ permissao.chave }}</small>
      </label>
    </div>
  </nb-card-body>
</nb-card>
