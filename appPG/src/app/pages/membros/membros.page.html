<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Membros</ion-title>
    <ion-buttons slot="end">
      <app-notificacao-bell></app-notificacao-bell>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list>
    <ion-list-header>Membros cadastrados</ion-list-header>
    <ion-item *ngFor="let membro of membros">
      <ion-label>
        <h2>{{ membro.nome || 'Sem nome' }}</h2>
        <p>{{ membro.tipo || 'Sem tipo' }} - {{ membro.status === 'A' ? 'Ativo' : 'Inativo' }}</p>
      </ion-label>
      <ion-button fill="clear" (click)="editar(membro)">Editar</ion-button>
      <ion-button fill="clear" color="danger" (click)="inativar(membro)" *ngIf="membro.status === 'A'">Inativar</ion-button>
    </ion-item>
  </ion-list>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button (click)="abrirModal()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
