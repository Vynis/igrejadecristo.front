<ion-header>
  <ion-toolbar color="primary">
    <ion-title>{{ editando ? 'Editar membro' : 'Novo membro' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="fechar()">Fechar</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="form" (ngSubmit)="salvar()">
    <ion-list>
      <ion-item><ion-label position="stacked">Nome</ion-label><ion-input formControlName="nome"></ion-input></ion-item>
      <ion-item><ion-label position="stacked">Telefone</ion-label><ion-input formControlName="telefone"></ion-input></ion-item>
      <ion-item><ion-label position="stacked">Data nascimento</ion-label><ion-input type="date" formControlName="dataNascimento"></ion-input></ion-item>
      <ion-item>
        <ion-label position="stacked">Tipo</ion-label>
        <ion-select formControlName="tipo">
          <ion-select-option value="Ativo">Ativo</ion-select-option>
          <ion-select-option value="Rotativo">Rotativo</ion-select-option>
          <ion-select-option value="Crianca">Criança</ion-select-option>
        </ion-select>
      </ion-item>
      <ion-item><ion-label position="stacked">Endereço</ion-label><ion-input formControlName="ruaAvenida"></ion-input></ion-item>
      <ion-item><ion-label position="stacked">Bairro</ion-label><ion-input formControlName="bairro"></ion-input></ion-item>
      <ion-item><ion-label position="stacked">Observação</ion-label><ion-textarea formControlName="observacao"></ion-textarea></ion-item>
    </ion-list>

    <ion-button expand="block" type="submit">Salvar</ion-button>
    <ion-button expand="block" fill="clear" type="button" (click)="fechar()">Cancelar</ion-button>
  </form>
</ion-content>
